name: Sync Upstream and Deploy

on:
  schedule:
    - cron: '0 4 * * *'  # щодня о 4:00 UTC (6:00 Київ)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync application code with upstream
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/mayswind/ezbookkeeping.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "No upstream application changes to sync."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"
          git merge --no-commit --no-ff upstream/main

          # The default GitHub Actions token cannot update workflow files. Keep
          # the repository's reviewed CI/deploy workflows while syncing the app.
          git restore --source=HEAD --staged --worktree .github/workflows

          if git diff --cached --quiet; then
            echo "Only upstream workflow changes were available."
            git merge --abort
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: sync application code from upstream"
          git push origin HEAD:main
          echo "updated=true" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    needs: sync
    if: needs.sync.outputs.updated == 'true'
    permissions:
      contents: read
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The sync job pushes a newer commit in this same workflow run.
          ref: main

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/grid-pilot/ezbookkeeping:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SKIP_TESTS=BankOfIsrael|ThirdParty|ApiLatest
